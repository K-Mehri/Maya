[project]
name = "maya-backend"
version = "0.1.0"
description = "FastApi backend for mayaBot project"
readme = "README.md"
authors = [
    { name = "mjrstl", email = "javadrostamlou930@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[project.scripts]
maya-backend = "maya_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
